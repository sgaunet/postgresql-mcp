version: 2
updates:
  # Go modules: highest attention. Checked weekly, one PR per module so each
  # bump is reviewed (and CI-verified) on its own.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
  # - package-ecosystem: docker
  #   directory: "/"
  #   schedule:
  #     interval: monthly
  #   open-pull-requests-limit: 10
  # GitHub Actions: low priority. Monthly, batched into a single PR, and
  # capped so it never crowds out the Go queue.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"