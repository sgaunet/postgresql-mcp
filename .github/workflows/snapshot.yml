name: snapshot

on:
  push:

permissions:
  contents: read

jobs:
  goreleaser-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Create snapshot release
        run: task snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
